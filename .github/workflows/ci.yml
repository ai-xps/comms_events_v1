name: CI

on:
  push:
    branches: [experiment, main]
  pull_request:
    branches: [experiment, main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./data/ci.db
      TEST_DATABASE_URL: file:./data/ci.db
      SESSION_SECRET: ci-only-session-secret-not-used-anywhere-else-0123456789
      CRON_SECRET: ci-only-cron-secret
      APP_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: mkdir -p prisma/data
      - run: npx prisma generate
      - run: npx prisma db push --skip-generate
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npx next build
