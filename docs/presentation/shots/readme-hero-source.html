<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gather — preview</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(900px 420px at 8% -8%, #ffffff 0%, transparent 55%),
          radial-gradient(700px 380px at 92% 0%, #ebebf0 0%, transparent 50%),
          #f5f5f7;
        color: #1d1d1f;
        line-height: 1.5;
      }
      .card {
        max-width: 420px;
        margin: 72px auto;
        background: #fff;
        border: 1px solid #d2d2d7;
        border-radius: 16px;
        padding: 32px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
      }
      .wordmark { font-weight: 700; font-size: 1.65rem; letter-spacing: -0.03em; margin: 0; }
      h1 { font-size: 1.5rem; margin: 8px 0 0; letter-spacing: -0.02em; }
      .lede { color: #6e6e73; margin: 12px 0 0; }
      label { display: grid; gap: 4px; font-weight: 600; margin-top: 16px; font-size: 0.95rem; }
      select, input {
        font: inherit;
        font-size: 16px;
        padding: 12px;
        min-height: 44px;
        border-radius: 12px;
        border: 1px solid #d2d2d7;
        background: #fff;
      }
      button {
        margin-top: 20px;
        width: 100%;
        background: #0071e3;
        color: #fff;
        border: 0;
        border-radius: 12px;
        min-height: 44px;
        font-weight: 600;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <p class="wordmark">Gather</p>
      <h1>Birmingham community events</h1>
      <p class="lede">Sign in with the cell number and password your cell leader gave you.</p>
      <label>
        Cell number
        <select aria-label="Cell number">
          <option>Choose your cell number</option>
        </select>
      </label>
      <label>
        Password
        <input type="password" aria-label="Password" autocomplete="off" />
      </label>
      <button type="button">Sign in</button>
    </div>
  </body>
</html>
